<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner Subtle Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Stylized S and X -->
  <g filter="url(#shadow)" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800">
    <!-- Letter S -->
    <text x="145" y="325" font-size="220" text-anchor="middle" letter-spacing="-6">S</text>
    <!-- Letter x with Cyan Tint -->
    <text x="345" y="325" font-size="205" text-anchor="middle" fill="#bae6fd" letter-spacing="-4">x</text>
  </g>

  <!-- Sparkle Particle / Movie Spark -->
  <circle cx="395" cy="165" r="14" fill="#fde047" />
  <path d="M395 135 L395 195 M365 165 L425 165" stroke="#fde047" stroke-width="4" stroke-linecap="round" />
</svg>
